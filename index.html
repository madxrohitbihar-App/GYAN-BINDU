<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Gyanbindu Live | Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #05050a;
            --bg-card: rgba(13, 15, 26, 0.85);
            --border-neon: rgba(0, 242, 254, 0.2);
            --border-hover: rgba(0, 242, 254, 0.6);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --neon-cyan: #00f2fe;
            --neon-blue: #4facfe;
            --neon-pink: #ff007f;
            --neon-green: #00ff66;
            --gradient-cyber: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --gradient-btn: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            --shadow-neon: 0 0 20px rgba(0, 242, 254, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            background: radial-gradient(circle at 50% -20%, #1a1c3a 0%, var(--bg-deep) 70%);
        }

        /* Main Container */
        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 90px;
        }

        /* Header */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: rgba(5, 5, 10, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-neon);
            position: sticky;
            top: 0;
            z-index: 101;
        }

        .brand-left {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .brand-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            flex-shrink: 0;
        }

        .brand-text-box {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .brand-header .header-main-title {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: var(--gradient-cyber);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            white-space: nowrap;
        }

        .brand-header .header-sub-title {
            font-size: 10.5px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-top: 1px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .header-tg-btn {
            background: linear-gradient(135deg, #0088cc 0%, #00a2ff 100%);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 15px rgba(0, 136, 204, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .header-tg-btn:active {
            transform: scale(0.95);
        }

        /* Search Section */
        .header-search {
            padding: 16px 16px 6px 16px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            background: var(--bg-card);
            border: 1px solid var(--border-neon);
            border-radius: 14px;
            color: #fff;
            font-size: 13.5px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--neon-cyan);
            box-shadow: var(--shadow-neon);
        }

        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-cyan);
            font-size: 15px;
        }

        /* Section Title */
        .section-title {
            font-size: 13px;
            font-weight: 700;
            margin: 16px 16px 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-primary);
            letter-spacing: 1px;
        }

        .title-with-dot {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Always Glowing Green Dot */
        .live-dot {
            width: 8px;
            height: 8px;
            background-color: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-green), 0 0 12px var(--neon-green);
            animation: dot-blink 1.2s infinite ease-in-out;
            display: inline-block;
        }

        @keyframes dot-blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        /* App Cards */
        .app-list {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active-tab {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .app-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-neon);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.25s ease;
        }

        .app-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.12);
        }

        .app-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            overflow: hidden;
        }

        .app-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            object-fit: cover;
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .app-details {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        .app-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: normal;
            word-break: break-word;
            line-height: 1.3;
        }

        .app-tag {
            font-size: 11px;
            color: var(--neon-green);
            margin-top: 3px;
            font-weight: 600;
        }

        .app-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .fav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-neon);
            color: var(--text-secondary);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .fav-btn.active {
            color: var(--neon-pink);
            border-color: rgba(255, 0, 127, 0.4);
            background: rgba(255, 0, 127, 0.1);
        }

        .open-btn {
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: var(--neon-cyan);
            padding: 9px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 12.5px;
            font-weight: 700;
            transition: all 0.2s;
        }

        .open-btn:hover {
            background: var(--gradient-btn);
            color: #fff;
            border-color: transparent;
            box-shadow: var(--shadow-neon);
        }

        /* Shayari Card Style */
        .shayari-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-neon);
            border-radius: 18px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.1);
            position: relative;
        }

        .shayari-card i.quote-icon {
            color: var(--neon-cyan);
            font-size: 24px;
            margin-bottom: 12px;
            opacity: 0.8;
        }

        .shayari-text {
            font-size: 14.5px;
            line-height: 1.8;
            color: var(--text-primary);
            font-weight: 500;
            margin-bottom: 16px;
            white-space: pre-line;
            font-style: italic;
        }

        .shayari-author {
            font-size: 13px;
            font-weight: 700;
            background: var(--gradient-cyber);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        /* Bottom Nav Footer */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: rgba(5, 5, 10, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--border-neon);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 102;
        }

        .nav-item {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 24px;
            transition: 0.2s;
        }

        .nav-item i {
            font-size: 18px;
        }

        .nav-item.active {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        }
    </style>
</head>
<body>

    <!-- Main App Container -->
    <div class="app-container">

        <!-- Header -->
        <div class="brand-header">
            <div class="brand-left">
                <img src="https://i.postimg.cc/Y23stYBT/ic-launcher.png" class="brand-avatar" alt="Logo">
                <div class="brand-text-box">
                    <div class="header-main-title">GYAN BINDU</div>
                    <div class="header-sub-title">Developer By MedxrohitBihar</div>
                </div>
            </div>
            <a href="https://t.me/Study_group_App" target="_blank" class="header-tg-btn">
                <i class="fa-brands fa-telegram"></i> Telegram
            </a>
        </div>

        <div class="header-search">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search apps..." onkeyup="filterApps()">
            </div>
        </div>

        <div class="section-title">
            <div class="title-with-dot">
                <span class="live-dot"></span>
                <span id="section-label">All Active App</span>
            </div>
            <span id="active-count" style="color: var(--neon-cyan);">1 Available</span>
        </div>

        <!-- TAB 1: ACTIVE APPS -->
        <div class="app-list tab-content active-tab" id="tab-active">
            <div class="app-card" data-name="GYAN BINDU LIVE">
                <div class="app-info">
                    <img src="https://i.postimg.cc/Y23stYBT/ic-launcher.png" class="app-icon" alt="GYAN BINDU LIVE">
                    <div class="app-details">
                        <span class="app-name">GYAN BINDU LIVE</span>
                        <span class="app-tag">Server Active</span>
                    </div>
                </div>
                <div class="app-actions">
                    <button class="fav-btn" onclick="toggleFavorite(this, 'GYAN BINDU LIVE')"><i class="fa-solid fa-heart"></i></button>
                    <a href="https://gift-madxrohitbihar.netlify.app/" class="open-btn" target="_blank" rel="noopener">Open</a>
                </div>
            </div>
        </div>

        <!-- TAB 2: BHAGAT SINGH SHAYARI -->
        <div class="app-list tab-content" id="tab-shayari">
            <div class="shayari-card">
                <i class="fa-solid fa-quote-left quote-icon"></i>
                <p class="shayari-text">
                    "वे मुझे मार सकते हैं, वे मेरे विचारों को मार सकते हैं,<br>
                    वे मेरे शरीर को कुचल सकते हैं,<br>
                    लेकिन वे मेरी सोच को नहीं मार सकते!"
                </p>
                <div class="shayari-author">~ शहीद-ए-आज़म भगत सिंह</div>
            </div>
        </div>

        <!-- TAB 3: FAVORITES -->
        <div class="app-list tab-content" id="tab-favorites">
            <div id="no-favorites-msg" style="text-align: center; color: var(--text-secondary); font-size: 13px; padding: 40px 0;">
                No favorite apps saved yet.
            </div>
            <div id="favorites-container" style="display: flex; flex-direction: column; gap: 12px;"></div>
        </div>

        <!-- Bottom Navigation Footer -->
        <div class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('active', this)">
                <i class="fa-solid fa-rocket"></i>
                <span>Active</span>
            </button>
            <button class="nav-item" onclick="switchTab('shayari', this)">
                <i class="fa-solid fa-feather-pointed"></i>
                <span>Shayari</span>
            </button>
            <button class="nav-item" onclick="switchTab('favorites', this)">
                <i class="fa-solid fa-heart"></i>
                <span>Favorites</span>
            </button>
        </div>

    </div>

    <script>
        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active-tab'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            btnElement.classList.add('active');

            const label = document.getElementById('section-label');
            const countLabel = document.getElementById('active-count');

            if (tabName === 'active') {
                document.getElementById('tab-active').classList.add('active-tab');
                label.innerText = "All Active App";
                countLabel.innerText = "1 Available";
            } else if (tabName === 'shayari') {
                document.getElementById('tab-shayari').classList.add('active-tab');
                label.innerText = "Shaheed Bhagat Singh";
                countLabel.innerText = "Tribute";
            } else if (tabName === 'favorites') {
                document.getElementById('tab-favorites').classList.add('active-tab');
                label.innerText = "All Saved Favorite";
                countLabel.innerText = "Saved";
                renderFavorites();
            }
        }

        function toggleFavorite(btn, appName) {
            btn.classList.toggle('active');
            let favorites = JSON.parse(localStorage.getItem('app_favorites') || "[]");
            
            const card = btn.closest('.app-card');
            const appData = {
                name: appName,
                html: card.outerHTML
            };

            const index = favorites.findIndex(item => item.name === appName);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(appData);
            }
            localStorage.setItem('app_favorites', JSON.stringify(favorites));
        }

        function loadFavoritesState() {
            let favorites = JSON.parse(localStorage.getItem('app_favorites') || "[]");
            const favNames = favorites.map(f => f.name);

            document.querySelectorAll('.app-card').forEach(card => {
                const nameEl = card.querySelector('.app-name');
                if (nameEl && favNames.includes(nameEl.innerText.trim())) {
                    const favBtn = card.querySelector('.fav-btn');
                    if(favBtn) favBtn.classList.add('active');
                }
            });
        }

        function renderFavorites() {
            let favorites = JSON.parse(localStorage.getItem('app_favorites') || "[]");
            const container = document.getElementById('favorites-container');
            const msg = document.getElementById('no-favorites-msg');

            container.innerHTML = "";
            if (favorites.length === 0) {
                msg.style.display = 'block';
            } else {
                msg.style.display = 'none';
                favorites.forEach(fav => {
                    container.innerHTML += fav.html;
                });
            }
        }

        function filterApps() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const activeTab = document.querySelector('.tab-content.active-tab');
            activeTab.querySelectorAll('.app-card').forEach(card => {
                const name = card.getAttribute('data-name');
                card.style.display = (!name || name.toLowerCase().includes(query)) ? 'flex' : 'none';
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadFavoritesState();
        });
    </script>
</body>
</html>
